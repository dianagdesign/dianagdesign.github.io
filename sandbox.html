<style>
:root{--bg:#FCFBF9;--card:#FFFFFF;--ink:#201F1B;--muted:#6B675F;--accent:#0057b8;--line:#E5E1D9;--rule:#E6E8EF;--serif:'Funnel Display',system-ui,sans-serif;--sans:'Funnel Sans',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace}
body.dark{--bg:#080D1E;--card:#10172E;--ink:#EEF1FA;--muted:#A5ADC4;--accent:#7FA1FF;--line:rgba(255,255,255,.12);--rule:rgba(255,255,255,.12)}
html,body{transition:background-color .3s ease,color .3s ease}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.sb-wrap{max-width:1280px;margin:0 auto;padding:40px clamp(16px,4vw,56px) 96px}
.sb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(40px,6vw,72px)}
.sb-logo{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--ink);text-decoration:none}
.sb-back{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer}
.sb-back:hover{border-color:var(--accent);color:var(--accent)}
.sb-intro{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.sb-intro h1{font-family:var(--serif);font-weight:400;font-size:clamp(48px,7vw,96px);line-height:.95;letter-spacing:-.02em;margin:0}
.sb-intro p{margin:0;max-width:40ch;font-size:17px;line-height:1.6;color:var(--muted)}
.sb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media (max-width:640px){.sb-grid{grid-template-columns:1fr}}
.shot{display:block;width:100%;margin:0;padding:0;border:1px solid var(--rule);background:var(--card);box-shadow:0 1px 2px rgba(30,32,41,.04),0 10px 30px -18px rgba(39,113,245,.25);border-radius:8px;overflow:hidden;position:relative;cursor:zoom-in;break-inside:avoid;text-align:left}
.shot img,.shot svg.viz{display:block;width:100%;height:auto;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.shot .cap{position:absolute;inset:auto 0 0 0;padding:40px 18px 16px;color:#fff;
  background:linear-gradient(180deg,rgba(14,18,34,0),rgba(14,18,34,.78));opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}
.shot .cap b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;margin-bottom:4px}
.shot .cap span{display:block;font-size:14px;line-height:1.45;opacity:.9}
.shot:hover img,.shot:focus-visible img,.shot:hover svg.viz,.shot:focus-visible svg.viz{transform:scale(1.02)}
.shot:hover .cap,.shot:focus-visible .cap{opacity:1;transform:none}
.shot:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (hover:none){.shot .cap{opacity:1;transform:none}}
.lb{position:fixed;inset:0;z-index:50;display:none;background:rgba(14,18,34,.86);backdrop-filter:blur(6px)}
.lb.on{display:grid;grid-template-columns:minmax(0,1fr) 340px}
.lb-img{display:flex;align-items:center;justify-content:center;padding:clamp(16px,3vw,48px);min-height:0}
.lb-img img{max-width:100%;max-height:calc(100vh - 96px);border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.lb-img svg.viz{width:min(100%,calc((100vh - 96px) * 4 / 3),960px);height:auto;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.lb-info{background:var(--bg);padding:72px 32px 32px;overflow:auto;display:flex;flex-direction:column}
.lb-info .d{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.lb-info h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.15;margin:0 0 16px}
.lb-info p{font-size:16px;line-height:1.65;color:var(--muted);margin:0 0 24px}
.lb-tools{display:flex;flex-wrap:wrap;gap:8px}
.lb-tools span{display:inline-flex;align-items:center;gap:7px;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 13px 6px 10px;background:var(--card)}
.lb-tools span svg{display:block;flex:none}
.lb-nav{margin-top:auto;padding-top:28px;display:flex;gap:10px}
.lb button{font:inherit;cursor:pointer}
.lb-nav button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px;font-size:14px}
.lb-nav button:hover{border-color:var(--accent);color:var(--accent)}
.lb-x{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;line-height:1}
@media (max-width:860px){.lb.on{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}
  .lb-img img{max-height:60vh}.lb-info{padding:28px 20px}}
@media (prefers-reduced-motion:reduce){.shot img,.shot .cap{transition:none}}

svg.viz{display:block;width:100%;height:auto}
svg.viz .vb,svg.viz .m1,svg.viz .m2{transform-box:fill-box;transform-origin:left center;transition:transform .9s cubic-bezier(.3,.7,.2,1) var(--d,0ms)}
svg.viz .vl,svg.viz .vd,svg.viz .dl{transition:opacity .4s ease var(--d,0ms)}
svg.viz .vc{stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset 1.3s cubic-bezier(.4,0,.2,1) var(--d,0ms)}
svg.viz .vp{transition:opacity .5s ease}
svg.viz .ra{transition:stroke-dashoffset 1.1s cubic-bezier(.3,.7,.2,1) var(--d,0ms)}
svg.viz .req{transition:opacity .35s ease}
svg.viz .skl{opacity:0}
svg.viz .cvv{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);transition:transform 1s cubic-bezier(.45,.05,.25,1) var(--d,0ms)}
svg.viz .cmpg:not(.on) .cvv.t2{transform:scaleY(1);transition:none}
svg.viz .cmpg .t2l{transition:opacity .3s}.svg-x{}
svg.viz .cmpg:not(.on) .t2l{opacity:0}
svg.viz .tgt{fill:#d7dce3;transition:fill .2s}.svg-y{}
svg.viz .cmpg.on .tgt{fill:#ff8300}
svg.viz .tgk{transform:translateX(-10px);transition:transform .2s}
svg.viz .cmpg.on .tgk{transform:none}
svg.viz.z .cvv{transform:scaleY(1);transition:none}
svg.viz .cv{transform-box:fill-box;transform-origin:right center;transform:scaleX(0);transition:transform 1.1s cubic-bezier(.45,.05,.25,1) var(--d,0ms)}
svg.viz.z .cv{transform:scaleX(1);transition:none}
svg.viz .tl{transition:opacity .35s ease, transform .35s cubic-bezier(.34,1.56,.64,1) var(--d,0ms);transform-box:fill-box;transform-origin:center}
svg.viz .tl.dim{opacity:.18}
svg.viz .tl.hl rect{stroke:#22262c;stroke-width:1.5}
svg.viz .mtip{opacity:0;transition:opacity .25s ease}
svg.viz .mtip.on{opacity:1}
svg.viz .mb{transform-box:fill-box;transform-origin:left center;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
svg.viz .mst,svg.viz .mleg,svg.viz .mga,svg.viz .mgb,svg.viz .mpp{transition:opacity .35s ease}
svg.viz .mga{opacity:0}
svg.viz.z .tl{transform:scale(0);transition:none}
svg.viz .skv{transition:opacity .45s ease var(--d,0ms)}
svg.viz.loading .skl{opacity:1;animation:vzpulse 1.1s ease-in-out infinite}
svg.viz.loading .skv{opacity:0;transition:none}
@keyframes vzpulse{0%,100%{opacity:.6}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){svg.viz .skl{animation:none}}
svg.viz.z .vb,svg.viz.z .m1,svg.viz.z .m2{transform:scaleX(0)!important;transition:none}
svg.viz.z .vl,svg.viz.z .vd,svg.viz.z .dl,svg.viz.z .vp,svg.viz.z .req{opacity:0!important;transition:none}
svg.viz.z .vc{stroke-dashoffset:1;transition:none}
svg.viz.z .ra{stroke-dashoffset:100;transition:none}
</style></head>

  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
